# Authoritative server for the synthetic zones (container "auth").
server:
    ip-address: 10.77.4.40
    port: 53
    server-count: 1
    zonesdir: "/etc/odoq/zones"
    database: ""
    zonelistfile: "/tmp/nsd-zone.list"
    xfrdfile: "/tmp/nsd-xfrd.state"
    pidfile: "/tmp/nsd.pid"
    logfile: ""
    verbosity: 1
    hide-version: yes
    refuse-any: yes
remote-control:
    control-enable: no
include: "/etc/odoq/nsd_zones.conf"
