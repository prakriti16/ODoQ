# Recursive resolver used by EVERY protocol frontend (DoQ, ODoQ, later DoH/ODoH).
# Runs inside the "resolver" container, reachable only on loopback.
server:
    interface: 127.0.0.1@5353
    access-control: 127.0.0.0/8 allow
    do-ip6: no
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/etc/odoq"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    num-threads: 1
    # behaviour that would make runs non-repeatable is switched off
    module-config: "iterator"
    prefetch: no
    serve-expired: no
    qname-minimisation: no
    minimal-responses: no
    cache-min-ttl: 0
    edns-buffer-size: 1232
    # all lookups stay inside the testbed (stub zones below)
    do-not-query-localhost: yes
include: "/etc/odoq/unbound_stubs.conf"
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
